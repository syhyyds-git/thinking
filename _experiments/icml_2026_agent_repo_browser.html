 which limits generalization or leaves the agent’s policy unchanged. We introduce EvolveR, an experience-driven framework that allows an agent to improve using its own interaction history.", "icml_url": "https://icml.cc/virtual/2026/poster/65641", "repo_url": "https://github.com/KnowledgeXLab/EvolveR", "owner_repo": "KnowledgeXLab/EvolveR", "repo_source": "icml_page", "verification_evidence": ["found on ICML page link: https://github.com/KnowledgeXLab/EvolveR"], "quality_grade": "A", "quality_scanned": true, "api_level": "runtime_api", "gpu_heavy": true, "has_repro_entry": true, "repro_entries": ["LLaMA-Factory/docker/docker-cuda/Dockerfile", "LLaMA-Factory/docker/docker-cuda/docker-compose.yml", "LLaMA-Factory/docker/docker-npu/Dockerfile", "LLaMA-Factory/docker/docker-npu/docker-compose.yml", "LLaMA-Factory/docker/docker-rocm/Dockerfile"], "code_file_count": 469, "total_file_count": 665, "readme_chars": 5902, "stars": 64, "archived": false, "pushed_at": "2026-05-08T02:49:51Z", "quality_reason": "api_runtime_repro: LLaMA-Factory/docker/docker-cuda/Dockerfile, LLaMA-Factory/docker/docker-cuda/docker-compose.yml, LLaMA-Factory/docker/docker-npu/Dockerfile", "directions": ["Multi-agent / 交互"], "primary_direction": "Multi-agent / 交互"}, {"poster_id": "64385", "title": "InfoPO: Information-Driven Policy Optimization for User-Centric Agents", "highlight": "A feasible approach is to identify valuable interaction turns at a fine granularity to drive more targeted learning. To address this, we introduce InfoPO, which frames multi-turn interaction as a process of active uncertainty reduction and computes an information-gain reward that credits turns whose feedback measurably changes the agent’s subsequent action distribution compared to a masked-feedback counterfactual.", "icml_url": "https://icml.cc/virtual/2026/poster/64385", "repo_url": "https://github.com/kfq20/InfoPO", "owner_repo": "kfq20/InfoPO", "repo_source": "title_search", "verification_evidence": ["readme contains  reasoning tasks, but it generates long natural-language rationales that are poorly optimized towards higher-level machine efficiency and intelligence. We propose *Communicative Language Symbolism Routing* (CLSR), a test-time framework in which multiple LLM agents autonomously *invent, evolve, and share* compact *Language Symbolism Frameworks* (LSFs), and a latent-free router adaptively selects and composes these ", "icml_url": "https://icml.cc/virtual/2026/poster/61557", "repo_url": "https://github.com/pzqpzq/LSF_MDia", "owner_repo": "pzqpzq/LSF_MDia", "repo_source": "icml_page", "verification_evidence": ["found on ICML page link: https://github.com/pzqpzq/LSF_MDia"], "quality_grade": "C", "quality_scanned": true, "api_level": "runtime_api", "gpu_heavy": false, "has_repro_entry": false, "repro_entries": [], "code_file_count": 12, "total_file_count": 48, "readme_chars": 6755, "stars": 6, "archived": false, "pushed_at": "2026-05-14T10:10:37Z", "quality_reason": "has_code_weak_repro", "directions": ["Multi-agent / 交互"], "primary_direction": "Multi-agent / 交互"}, {"poster_id": "65821", "title": "When Planning Fails Despite Correct Execution: On Epistemic Calibration for LLM-Based Multi-Agent Systems", "highlight": "Unlike execution errors, epistemic miscalibration is latent during planning, as generated plans can remain self-consistent and executable without observable errors; the miscalibration is also dynamic, as new information can alter feasibility assessments, potentially obscuring past miscalibration signals and causing them to recur over time. To address this, we propose the Epistemic Planning Calibration Agentic Workflow (EPC-AW), which assesses whether plans remain supported under varying informat", "icml_url": "https://icml.cc/virtual/2026/poster/65821", "repo_url": "https://github.com/wzhSteve/EPC-AW", "owner_repo": "wzhSteve/EPC-AW", "repo_source": "icml_page", "verification_evidence": ["found on ICML page link: https://github.com/wzhSteve/EPC-AW"], "quality ], "primary_direction": "Web / GUI / Computer-use"}, {"poster_id": "65128", "title": "Milestone-Guided Policy Learning for Long-Horizon Language Agents", "highlight": "We introduce a milestone-guided policy learning framework, BEACON, that leverages the compositional structure of long-horizon tasks to ensure precise credit assignment.", "icml_url": "https://icml.cc/virtual/2026/poster/65128", "repo_url": "https://github.com/ZJU-REAL/BEACON", "owner_repo": "ZJU-REAL/BEACON", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"Milestone-Guided Policy Learning for Long-Horizon Language Agents\"", "readme mentions project name: \"Milestone-Guided\"", "readme mentions project name: \"Long-Horizon\""], "quality_grade": "A", "quality_scanned": true, "api_level": "none", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["agent_system/environments/env_package/gym_cards/gym-cards/setup.py", "agent_system/environments/env_package/search/third_party/pyproject.toml", "agent_system/environments/env_package/webshop/webshop/baseline_models/requirements.txt", "agent_system/environments/env_package/webshop/webshop/requirements.txt", "pyproject.toml"], "code_file_count": 625, "total_file_count": 1242, "readme_chars": 7617, "stars": 17, "archived": false, "pushed_at": "2026-05-29T11:57:31Z", "quality_reason": "lightweight_repro: agent_system/environments/env_package/gym_cards/gym-cards/setup.py, agent_system/environments/env_package/search/third_party/pyproject.toml, agent_system/environments/env_package/webshop/webshop/baseline_models/requirements.txt", "directions": ["Web / GUI / Computer-use", "记忆 / RAG / 知识"], "primary_direction": "Web / GUI / Computer-use"}, {"poster_id": "60816", "title": "Next-Gen CAPTCHAs: Leveraging The Cognitive Gap for Scalable and Diverse GUI-Agent Defense", "highlight": "In response, we introduce Next-Gen CAPTCHAs, a scalable defense framework designed to secure the next-generation web against the advanced a  due to constrained context windows and static policies that fail to adapt to dynamic environments. To address these limitations, this work proposes the Self-Evolving GUI Agent (SE-GA), a novel framework that integrates hierarchical memory structures with an iterative self-improvement mechanism.", "icml_url": "https://icml.cc/virtual/2026/poster/65853", "repo_url": "https://github.com/jinshilong-dev/SE-GA", "owner_repo": "jinshilong-dev/SE-GA", "repo_source": "icml_page", "verification_evidence": ["found on ICML page link: https://github.com/jinshilong-dev/SE-GA"], "quality_grade": "A", "quality_scanned": true, "api_level": "runtime_api", "gpu_heavy": true, "has_repro_entry": true, "repro_entries": ["pyproject.toml", "requirements.txt"], "code_file_count": 140, "total_file_count": 160, "readme_chars": 7234, "stars": 7, "archived": false, "pushed_at": "2026-06-02T01:30:39Z", "quality_reason": "api_runtime_repro: pyproject.toml, requirements.txt", "directions": ["Web / GUI / Computer-use", "记忆 / RAG / 知识"], "primary_direction": "Web / GUI / Computer-use"}, {"poster_id": "63090", "title": "T$^2$PO: Uncertainty-Guided Exploration Control for Stable Multi-Turn Agentic Reinforcement Learning", "highlight": "We argue that this instability stems from inefficient exploration in multi-turn settings, where policies continue to generate low-information actions that neither reduce uncertainty nor advance task progress. To address this issue, we propose Token- and Turn-level Policy Optimization (T$^2$PO), an uncertainty-aware framework that explicitly controls exploration at fine-grained levels.", "icml_url": "https://icml.cc/virtual/2026/poster/63090", "repo_url": "https://github.com/WillDreamer/T2PO", "owner_repo": "WillDreamer/T2PO", "repo_source": "icml_page", "verification_evidence": ["found on ICML page link: https://github.com/WillDreamer/T2PO"], "quality_grade": "A", "quality_scanned": true, "api_level": "none", "gpu_heavy": false, "has_repro_entry": true, "repro_entries" itates test-time scaling for complex medical reasoning by iteratively evolving both external evidence and internal reasoning history within an agentic refinement loop.", "icml_url": "https://icml.cc/virtual/2026/poster/63972", "repo_url": "https://github.com/NJU-RL/MA-RAG", "owner_repo": "NJU-RL/MA-RAG", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"From Conflict to Consensus: Boosting Medical Reasoning Via Multi-Round Agentic RAG\""], "quality_grade": "A", "quality_scanned": true, "api_level": "none", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["scripts"], "code_file_count": 9, "total_file_count": 22, "readme_chars": 2825, "stars": 4, "archived": false, "pushed_at": "2026-05-05T09:00:26Z", "quality_reason": "lightweight_repro: scripts", "directions": ["医疗 / 高风险", "记忆 / RAG / 知识"], "primary_direction": "医疗 / 高风险"}, {"poster_id": "64357", "title": "MedScope: Incentivizing \"Think with Videos\" for Clinical Reasoning Via Coarse-to-Fine Tool Calling", "highlight": "However, current multimodal large language models typically process videos with passive sampling or weakly grounded inspection, which limits their ability to iteratively locate, verify, and justify predictions with temporally targeted evidence. To close this gap, we propose **MedScope**, a tool-using clinical video reasoning model that performs coarse-to-fine evidence seeking over long-form procedures.", "icml_url": "https://icml.cc/virtual/2026/poster/64357", "repo_url": "https://github.com/SII-WenjieLisjtu/MedScope", "owner_repo": "SII-WenjieLisjtu/MedScope", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"MedScope: Incentivizing \"Think with Videos\" for Clinical Reasoning Via Coarse-to-Fine Tool Calling\"", "readme mentions project name: \"MedScope\"", "repo name matches project name: \"MedScope\""], "quality_grade": "未扫描", "quality_scanned": false, "api_level": "unknown", "gpu_heavy": null, "has_repro_en Ms with verifiable feedback, featuring 658 fully functional Capture-The-Flag (CTF)-style challenges containerized in Docker with guaranteed reproducibility.", "icml_url": "https://icml.cc/virtual/2026/poster/61783", "repo_url": "https://github.com/amazon-science/CTF-Dojo", "owner_repo": "amazon-science/CTF-Dojo", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"Training Language Model Agents to Find Vulnerabilities with CTF-Dojo\""], "quality_grade": "A", "quality_scanned": true, "api_level": "runtime_api", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["requirements.txt"], "code_file_count": 10, "total_file_count": 20, "readme_chars": 4920, "stars": 49, "archived": false, "pushed_at": "2026-01-10T01:31:14Z", "quality_reason": "api_runtime_repro: requirements.txt", "directions": ["安全 / 攻防 / 对齐"], "primary_direction": "安全 / 攻防 / 对齐"}, {"poster_id": "62233", "title": "Unsafer in Many Turns: Benchmarking and Defending Multi-Turn Safety Risks in Tool-Using Agents", "highlight": "To systematically scale safety testing in multi-turn, tool-realistic settings, we propose a principled taxonomy that transforms single-turn harmful tasks into multi-turn attack sequences.", "icml_url": "https://icml.cc/virtual/2026/poster/62233", "repo_url": "https://github.com/CHATS-lab/ToolShield", "owner_repo": "CHATS-lab/ToolShield", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"Unsafer in Many Turns: Benchmarking and Defending Multi-Turn Safety Risks in Tool-Using Agents\""], "quality_grade": "A", "quality_scanned": true, "api_level": "runtime_api", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["docker/Dockerfile", "docker/docker-compose.yml", "docs/requirements.txt", "pyproject.toml", "setup.py"], "code_file_count": 26, "total_file_count": 58, "readme_chars": 10502, "stars": 22, "archived": false, "pushed_at": "2026-03-15T21:26:22Z", "quality_reason": "api_runtime_repro: docker ing how they arise from benign inputs.", "icml_url": "https://icml.cc/virtual/2026/poster/64242", "repo_url": "https://github.com/OSU-NLP-Group/AutoElicit", "owner_repo": "OSU-NLP-Group/AutoElicit", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"When Benign Inputs Lead to Severe Harms: Eliciting Unsafe Unintended Behaviors of Computer-Use Agents\""], "quality_grade": "A", "quality_scanned": true, "api_level": "none", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["desktop_env/controllers/setup.py", "desktop_env/server/requirements.txt", "requirements.txt"], "code_file_count": 497, "total_file_count": 885, "readme_chars": 9915, "stars": 7, "archived": false, "pushed_at": "2026-05-20T16:51:07Z", "quality_reason": "lightweight_repro: desktop_env/controllers/setup.py, desktop_env/server/requirements.txt, requirements.txt", "directions": ["安全 / 攻防 / 对齐", "Web / GUI / Computer-use"], "primary_direction": "安全 / 攻防 / 对齐"}, {"poster_id": "62170", "title": "When Embedding-Based Defenses Fail: Rethinking Safety in LLM-Based Multi-Agent Systems", "highlight": "In this paper, we use confidence score to prune or down-weight messages during MAS communication.", "icml_url": "https://icml.cc/virtual/2026/poster/62170", "repo_url": "https://github.com/chili-lab/rethinking-mas-defense", "owner_repo": "chili-lab/rethinking-mas-defense", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"When Embedding-Based Defenses Fail: Rethinking Safety in LLM-Based Multi-Agent Systems\"", "readme mentions project name: \"Embedding-Based\""], "quality_grade": "A", "quality_scanned": true, "api_level": "runtime_api", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["requirements.txt", "scripts"], "code_file_count": 11, "total_file_count": 13, "readme_chars": 3717, "stars": 0, "archived": false, "pushed_at": "2026-05-29T06:33:54Z", "quality_reason": "api_runtime_repro: requirements.txt, scripts", "directions": ["安全 / 攻防 / 对齐", "Benchmark / Evaluation", "Multi-agent / 交互"], "primary_direction": "安全 / 攻防 / 对齐"}, {"poster_id": "65930", "title": "AOrchestra: Automating Sub-Agent Creation for Agentic Orchestration", "highlight": "Building on this abstraction, we introduce an agentic system AOrchestra, where the central orchestrator concretizes the tuple at each step: it curates task-relevant context, selects tools and models, and delegates execution via on-the-fly automatic agent creation.", "icml_url": "https://icml.cc/virtual/2026/poster/65930", "repo_url": "https://github.com/FoundationAgents/AOrchestra", "owner_repo": "FoundationAgents/AOrchestra", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"AOrchestra: Automating Sub-Agent Creation for Agentic Orchestration\""], "quality_grade": "A", "quality_scanned": true, "api_level": "runtime_api", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["requirements.txt", "benchmark"], "code_file_count": 70, "total_file_count": 88, "readme_chars": 5724, "stars": 125, "archived": false, "pushed_at": "2026-05-25T09:06:36Z", "quality_reason": "api_runtime_repro: requirements.txt, benchmark", "directions": ["工具调用 / 编排"], "primary_direction": "工具调用 / 编排"}, {"poster_id": "65574", "title": "AutoTool: Dynamic Tool Selection and Integration for Agentic Reasoning", "highlight": "We present AutoTool, a training framework that equips LLM agents with dynamic tool-selection capabilities throughout their reasoning trajectories.", "icml_url": "https://icml.cc/virtual/2026/poster/65574", "repo_url": "https://github.com/Gen-Verse/Open-AgentRL", "owner_repo": "Gen-Verse/Open-AgentRL", "repo_source": "icml_page", "verification_evidence": ["found on ICML page link: https://github.com/Gen-Verse/Open-AgentRL"], "quality_grade": "A", "quality_scanned": true, "api_level": "none", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["OSWorld-main/desktop_env/controllers/setup.py", "O e contains full title: \"DIVE: Scaling Diversity in Agentic Task Synthesis for Generalizable Tool Use\""], "quality_grade": "A", "quality_scanned": true, "api_level": "runtime_api", "gpu_heavy": false, "has_repro_entry": true, "repro_entries": ["pyproject.toml"], "code_file_count": 837, "total_file_count": 880, "readme_chars": 4289, "stars": 20, "archived": false, "pushed_at": "2026-03-13T03:16:12Z", "quality_reason": "api_runtime_repro: pyproject.toml", "directions": ["工具调用 / 编排"], "primary_direction": "工具调用 / 编排"}, {"poster_id": "61111", "title": "Diversity Over Frequency: Rethinking Tool Use in Visual Chain-of-Thought Agents", "highlight": "Prior work has primarily demonstrated the effectiveness of these tools on visual search tasks, leaving their applicability to more diverse and complex visual problems underexplored. In this paper, we move beyond visual search and study challenging visual tasks that require advanced spatial understanding and reasoning, such as 3D spatial reasoning, where agents must not only crop or zoom in on relevant regions but also understand how these local details relate to the global context.", "icml_url": "https://icml.cc/virtual/2026/poster/61111", "repo_url": "https://github.com/UTLLab/scaffolded-exploration", "owner_repo": "UTLLab/scaffolded-exploration", "repo_source": "title_search", "verification_evidence": ["readme contains full title: \"Diversity Over Frequency: Rethinking Tool Use in Visual Chain-of-Thought Agents\""], "quality_grade": "D", "quality_scanned": true, "api_level": "none", "gpu_heavy": false, "has_repro_entry": false, "repro_entries": [], "code_file_count": 0, "total_file_count": 1, "readme_chars": 0, "stars": 0, "archived": false, "pushed_at": "2026-05-25T14:56:24Z", "quality_reason": "readme_only_or_too_minimal", "directions": ["工具调用 / 编排"], "primary_direction": "工具调用 / 编排"}, {"poster_id": "64668", "title": "From Shortcuts to Reasoning: Robust Post-Training of Theory of Mind with Reinforcement Learning", "highlig <script>
const payload = JSON.parse(document.getElementById('paper-data').textContent);
const PAPERS = payload.papers;
const STATS = payload.stats;
const state = {grade:new Set(), api:new Set(), gpu:new Set(), repro:new Set(), direction:new Set(), source:new Set(), scanned:new Set()};

const gradeOrder = {"A":0,"B":1,"C":2,"D":3,"未扫描":4};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boolLabel = v => v === true ? '是' : (v === false ? '否' : '未知');
const apiLabel = v => ({runtime_api:'Runtime API', readme_only:'README API', none:'No API', unknown:'未扫描'}[v] || v || '未扫描');
const gradeClass = g => g === '未扫描' ? 'grade-U' : 'grade-' + g;

function uniqueCounts(keyFn) {
  const m = new Map();
  PAPERS.forEach(p => {
    const vals = keyFn(p);
    (Array.isArray(vals) ? vals : [vals]).forEach(v => m.set(v, (m.get(v) || 0) + 1));
  });
  return [...m.entries()].sort((a,b) => String(a[0]).localeCompare(String(b[0]), 'zh'));
}

function addGroup(root, title, key, items) {
  const box = document.createElement('div');
  box.className = 'group';
  box.innerHTML = `<div class="group-head"><h2>${esc(title)}</h2><button class="reset" data-reset="${key}">清空</button></div><div class="chips"></div>`;
  const chips = box.querySelector('.chips');
  items.forEach(([value, count]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.key = key;
    b.dataset.value = value;
    b.innerHTML = `${esc(value)} <small>${count}</small>`;
    chips.appendChild(b);
  });
  root.appendChild(box);
}

function buildFilters() {
  const root = document.getElementById('filter-root');
  root.innerHTML = '';
  addGroup(root, '质量等级', 'grade', uniqueCounts(p => p.quality_grade));
  addGroup(root, 'API 状态', 'api', uniqueCounts(p => apiLabel(p.api_level)));
  addGroup(root, 'GPU-heavy', 'gpu', uniqueCounts(p => boolLabel(p.gpu_heavy)));
  addGroup(root, '复现入口', 'repro', uniqueCounts(p => boolLabel(p.has_repro_entry)));
  addGroup(root, '扫描状态', 'scanned', uniqueCounts(p => p.quality_scanned ? '已扫描' : '未扫描'));
  addGroup(root, '仓库来源', 'source', uniqueCounts(p => p.repo_source || 'unknown'));
  addGroup(root, '方向', 'direction', uniqueCounts(p => p.directions));
}

function chipValueFor(p, key) {
  if (key === 'grade') return [p.quality_grade];
  if (key === 'api') return [apiLabel(p.api_level)];
  if (key === 'gpu') return [boolLabel(p.gpu_heavy)];
  if (key === 'repro') return [boolLabel(p.has_repro_entry)];
  if (key === 'scanned') return [p.quality_scanned ? '已扫描' : '未扫描'];
  if (key === 'source') return [p.repo_source || 'unknown'];
  if (key === 'direction') return p.directions;
  return [];
}

function matchesSet(p, key) {
  if (!state[key].size) return true;
  const values = chipValueFor(p, key);
  return values.some(v => state[key].has(v));
}

function getFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = PAPERS.filter(p => {
    if (!matchesSet(p,'grade') || !matchesSet(p,'api') || !matchesSet(p,'gpu') || !matchesSet(p,'repro') || !matchesSet(p,'scanned') || !matchesSet(p,'source') || !matchesSet(p,'direction')) return false;
    if (!q) return true;
    return [p.poster_id,p.title,p.highlight,p.owner_repo,p.repo_url,p.primary_direction].join(' ').toLowerCase().includes(q);
  });
  const sort = document.getElementById('sort').value;
  rows = rows.slice();
  if (sort === 'stars') rows.sort((a,b) => (b.stars ?? -1) - (a.stars ?? -1) || a.title.localeCompare(b.title));
  else if (sort === 'code') rows.sort((a,b) => (b.code_file_count ?? -1) - (a.code_file_count ?? -1) || a.title.localeCompare(b.title));
  else if (sort === 'title') rows.sort((a,b) => a.title.localeCompare(b.title));
  else if (sort === 'direction') rows.sort((a,b) => a.primary_direction.localeCompare(b.primary_direction, 'zh') || a.title.localeCompare(b.title));
  else rows.sort((a,b) => (gradeOrder[a.quality_grade] ?? 9) - (gradeOrder[b.quality_grade] ?? 9) || (b.stars ?? -1) - (a.stars ?? -1));
  return rows;
}

function renderStats() {
  document.getElementById('stat-total').textContent = STATS.total;
  document.getElementById('stat-scanned').textContent = STATS.quality_scanned;
  document.getElementById('stat-a').textContent = STATS.grade_counts.A || 0;
  document.getElementById('stat-b').textContent = STATS.grade_counts.B || 0;
}

function render() {
  document.querySelectorAll('.chip').forEach(chip => {
    const set = state[chip.dataset.key];
    chip.classList.toggle('on', set.has(chip.dataset.value));
  });
  const rows = getFiltered();
  document.getElementById('count').textContent = `${rows.length} / ${PAPERS.length}`;
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  if (!rows.length) {
    cards.innerHTML = '<div class="empty">没有匹配的论文</div>';
    return;
  }
  rows.forEach(p => {
    const c = document.createElement('article');
    c.className = 'card';
    const dirs = p.directions.map(d => `<span class="tag dir">${esc(d)}</span>`).join('');
    const evidence = (p.verification_evidence || []).map(e => `<div>${esc(e)}</div>`).join('');
    const repro = (p.repro_entries && p.repro_entries.length) ? p.repro_entries.join(', ') : '未知';
    c.innerHTML = `
      <div class="card-head">
        <div class="title">${esc(p.title)}</div>
        <div class="meta">
          <span class="tag ${gradeClass(p.quality_grade)}">${esc(p.quality_grade)}</span>
          ${dirs}
          <span class="tag api">${esc(apiLabel(p.api_level))}</span>
          <span class="tag gpu">GPU ${esc(boolLabel(p.gpu_heavy))}</span>
          <span class="tag repo">${esc(p.owner_repo)}</span>
        </div>
      </div>
      <div class="body">
        <div class="highlight">${esc(p.highlight || '无 highlight')}</div>
        <div class="detail-grid">
          <div class="detail"><span>Stars</span><b>${esc(p.stars ?? '未知')}</b></div>
          <div class="detail"><span>代码文件</span><b>${esc(p.code_file_count ?? '未知')}</b></div>
          <div class="detail"><span>总文件</span><b>${esc(p.total_file_count ?? '未知')}</b></div>
          <div class="detail"><span>复现入口</span><b>${esc(boolLabel(p.has_repro_entry))}</b></div>
          <div class="detail"><span>Repo source</span><b>${esc(p.repo_source || 'unknown')}</b></div>
          <div class="detail"><span>Poster</span><b>${esc(p.poster_id)}</b></div>
          <div class="detail"><span>Pushed at</span><b>${esc(p.pushed_at || '未知')}</b></div>
          <div class="detail"><span>Repro entries</span><b>${esc(repro)}</b></div>
        </div>
        <div class="evidence">
          <div><b>质量原因：</b>${esc(p.quality_reason)}</div>
          ${evidence}
        </div>
        <div class="links">
          <a class="btn github" target="_blank" href="${esc(p.repo_url)}">GitHub</a>
          <a class="btn icml" target="_blank" href="${esc(p.icml_url)}">ICML</a>
          <a class="btn ghost" target="_blank" href="https://github.com/${esc(p.owner_repo)}">Repo root</a>
        </div>
      </div>`;
    c.querySelector('.card-head').addEventListener('click', () => c.classList.toggle('open'));
    cards.appendChild(c);
  });
}

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const set = state[chip.dataset.key];
    set.has(chip.dataset.value) ? set.delete(chip.dataset.value) : set.add(chip.dataset.value);
    render();
  }
  const reset = e.target.closest('.reset');
  if (reset) {
    state[reset.dataset.reset].clear();
    render();
  }
});
document.getElementById('search').addEventListener('input', render);
document.getElementById('sort').addEventListener('change', render);
buildFilters();
renderStats();
render();
</script>
</body>
</html>
